server_config:
  strategy: None
  num_rounds: 200
  num_clients: 100
  participate_ratio: 0.1
  drop_ratio: 0.0
  test_every: 1
  split_testset: False
  use_tqdm: False
  dataset: Mnist
  partition: None
  beta: None
  num_classes_per_client: None
  num_shards_per_client: None
  num_classes: 10
  learning_rate: 1.0
  lr_decay_per_round: 1.0
  exclude: !!python/tuple []
  FedNH_smoothing: 0.9
  FedNH_server_adv_prototype_agg: False

client_config:
  model: ResNet10Mod
  input_size: !!python/tuple [1, 28, 28]
  num_classes: 10
  num_epochs: 5
  batch_size: 64
  optimizer: SGD
  learning_rate: 0.1
  client_lr_scheduler: stepwise
  lr_decay_per_round: 0.99
  num_rounds: 200
  use_tqdm: False
  no_norm: True
  sgd_momentum: 0.9
  sgd_weight_decay: 0.00001
  FedROD_hyper_clf: True
  FedROD_phead_separate: False
  FedNH_return_embedding: False
  FedNH_head_init: orthogonal
  FedNH_client_adv_prototype_agg: False
  FedNH_fix_scaling: False
  FedProto_lambda: 0.1
  FedRep_head_epochs: 10
  FedBABU_finetune_epoch: 5
  Ditto_lambda: 0.75
  CReFF_batch_real: 64
